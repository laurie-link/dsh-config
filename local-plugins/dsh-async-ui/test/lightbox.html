<!doctype html>
<html><head><meta charset="utf-8"><title>lightbox backdrop test</title>
<style>
  body { font: 14px -apple-system, sans-serif; background:#111; color:#eee; }
  dialog { width:70vw; height:60vh; background:#1b1b1b; color:#eee; border:1px solid #333; border-radius:12px; }
  dialog::backdrop { background: rgba(0,0,0,.72); }
  .header { display:flex; justify-content:space-between; align-items:center; }
</style></head>
<body>
<button id="open">open lightbox</button>
<pre id="log" aria-live="polite"></pre>
<dialog id="g" aria-labelledby="g-dialog-title">
  <div class="header">
    <h3 id="g-dialog-title">Gallery</h3>
    <button id="close" type="button" aria-label="close">×</button>
  </div>
  <figure><img src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw==" style="width:120px;height:120px"></figure>
</dialog>
<script>
  // Minimal __ModuleLoader__ shim so ../client.js can run unmodified.
  window.__ModuleLoader__ = { load({ factory }) { const mod = factory(); mod.apply({ effect(fn) { fn() } }) } }
  const log = (m) => { document.getElementById('log').textContent += m + '\n' }
  const d = document.getElementById('g')
  document.getElementById('open').addEventListener('click', () => d.showModal())
  document.getElementById('close').addEventListener('click', () => { d.close(); log('closed-by-x') })
  // React 18 delegates key handlers to the document root: emulate that here.
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && d.open) { d.close(); log('closed-by-escape') }
  })
</script>
<script src="../client.js?v=TEST"></script>
</body></html>
