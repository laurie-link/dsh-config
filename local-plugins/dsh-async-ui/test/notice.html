<!doctype html>
<html lang="zh"><head><meta charset="utf-8">
<title>async-ui export-notice harness</title>
<style>
  :root { color-scheme: dark; }
  body { margin:0; padding:28px; font:15px/1.6 -apple-system,"PingFang SC",sans-serif;
         background:#0f1115; color:#e6e8ee; }
  .case { max-width:640px; margin:0 auto 22px; background:#171a21; border:1px solid #262b36;
          border-radius:14px; padding:18px; }
  .case > .name { font-size:12px; color:#7d879a; margin-bottom:10px; }
  /* GenUI's export chrome: notice on the left, icon button on the right. */
  [data-genui-export] { display:flex; align-items:center; gap:10px; }
  [data-genui-export] span { font-size:12px; color:#8b93a5; }
</style></head>
<body>
  <!-- Case A: the stock warning GenUI prints above every card with a remote picture -->
  <div class="case">
    <div class="name">A · GenUI 的默认提示（应被隐藏）</div>
    <div data-genui-export>
      <span>此页面含有外部媒体，离线打开时部分内容可能无法显示。</span>
      <button type="button" aria-label="导出">⤓</button>
    </div>
  </div>

  <!-- Case B: English build -->
  <div class="case">
    <div class="name">B · 英文文案（应被隐藏）</div>
    <div data-genui-export>
      <span>External media may not appear when this file is opened offline.</span>
      <button type="button" aria-label="Export">⤓</button>
    </div>
  </div>

  <!-- Case C: a notice that is not the stock one must survive -->
  <div class="case">
    <div class="name">C · 非默认提示（应保留）</div>
    <div data-genui-export>
      <span>导出的单文件不含图片字节。</span>
      <button type="button" aria-label="导出">⤓</button>
    </div>
  </div>

<script>
  window.__ModuleLoader__ = {
    load({ id, factory }) {
      window.__pluginId = id
      const mod = factory()
      mod.apply({ effect(fn) { window.__dispose = fn() } })
    },
  }
  window.__result = () => [...document.querySelectorAll('[data-genui-export] span')].map(s => ({
    text: s.textContent.trim(),
    hidden: s.hasAttribute('data-async-ui-hide'),
    display: getComputedStyle(s).display,
  }))
</script>
<script src="../client.js?v=2"></script>
</body></html>
